[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "squord.py"
version = "0.1.0"
description = "O SDK oficial do Squord para criar bots em Python: REST tipado, gateway em tempo real, comandos, interações e moderação."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Squord", url = "https://squord.com.br" }]
keywords = ["squord", "bot", "sdk", "gateway", "websocket", "space"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Chat",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["aiohttp>=3.9,<4"]

[project.urls]
Homepage = "https://docs.squord.com.br"
Repository = "https://github.com/Squord/squord-sdk-python"
Issues = "https://github.com/Squord/squord-sdk-python/issues"
Changelog = "https://github.com/Squord/squord-sdk-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/squord"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
# A fronteira REST é JSON dinâmico: os payloads são validados em runtime
# (90 testes); o code no-any-return seria ruído de cast em cada manager.
disable_error_code = ["no-any-return"]
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
